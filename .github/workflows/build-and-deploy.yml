name: Build Firmware and Deploy Web Installer

# Every push builds the firmware so breakage shows up early.
# Pushes to main (and manual runs on main) also publish the web installer,
# with freshly built firmware, to GitHub Pages.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ESP-IDF 5.4.1 + esp-matter; upstream TLED does not pin an esp-matter version
    container: espressif/esp-matter:release-v1.4.2_idf_v5.4.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          . "$ESP_MATTER_PATH/export.sh"
          idf.py build

      - name: Collect web installer binaries
        shell: bash
        run: |
          mkdir -p firmware
          cp build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin \
             build/ota_data_initial.bin \
             build/tled.bin \
             firmware/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: web-installer/firmware/

      - name: Set version in manifest
        run: |
          VERSION=$(grep 'set(PROJECT_VER ' CMakeLists.txt | grep -o '"[^"]*"' | tr -d '"')
          VERSION="${VERSION}-${GITHUB_SHA::7}"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" web-installer/manifest.json
          echo "Publishing firmware version ${VERSION}"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-installer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
